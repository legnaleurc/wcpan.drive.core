[project]
name = "wcpan-drive-core"
version = "5.0.5"
description = "asynchronous generic cloud drive library"
authors = [
    {name = "Wei-Cheng Pan", email = "legnaleurc@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
source = "https://github.com/legnaleurc/wcpan.drive.core"

[dependency-groups]
dev = [
    "ruff>=0.15.0,<1.0.0",
]
docs = [
    "furo",
    "sphinx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wcpan"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE.txt",
]
